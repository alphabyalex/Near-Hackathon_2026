[workspace]
resolver = "2"
members = ["vault", "evidence", "mock-token", "test-proxy", "payee-registry"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/alphabyalex/Near-Hackathon_2026"

# Exact pins: every crate in this workspace builds against these versions.
# Keep in sync with contracts/rust-toolchain.toml and contracts/vault/README.md.
[workspace.dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
