// Mini re-implementation of the Stewdio scenes, using the same drawing code, to preview frames.
const hex=h=>{h=h.replace('#','');const n=s=>parseInt(s,16)/255;return{r:n(h.slice(0,2)),g:n(h.slice(2,4)),b:n(h.slice(4,6)),a:h.length>6?n(h.slice(6,8)):1}};
const css=(c,k=1)=>`rgba(${Math.round(c.r*255)},${Math.round(c.g*255)},${Math.round(c.b*255)},${c.a*k})`;
function bez(x1,y1,x2,y2,x){let t=x;for(let i=0;i<20;i++){const cx=3*x1*t*(1-t)**2+3*x2*t*t*(1-t)+t**3-x;const d=3*x1*(1-t)**2+6*(x2-x1)*t*(1-t)+3*(1-x2)*t*t;if(Math.abs(d)<1e-6)break;t-=cx/d;t=Math.max(0,Math.min(1,t))}return 3*y1*t*(1-t)**2+3*y2*t*t*(1-t)+t**3}
function sample(kfs,t){if(t<=kfs[0][0])return typeof kfs[0][1]==='string'?hex(kfs[0][1]):kfs[0][1];const L=kfs[kfs.length-1];const fx=v=>typeof v==='string'?hex(v):v;if(t>=L[0])return fx(L[1]);for(let i=0;i<kfs.length-1;i++){const[a,va,e]=kfs[i],[b,vb]=kfs[i+1];if(t>=a&&t<b){let u=(t-a)/(b-a);if(e==='hold')return typeof va==='string'?hex(va):va;if(e)u=bez(...e,u);return lerp(va,vb,u)}}}
function lerp(a,b,u){if(typeof a==='number')return a+(b-a)*u;if(Array.isArray(a))return a.map((x,i)=>x+(b[i]-x)*u);const A=hex(a),B=hex(b);return{r:A.r+(B.r-A.r)*u,g:A.g+(B.g-A.g)*u,b:A.b+(B.b-A.b)*u,a:A.a+(B.a-A.a)*u}}
const D={
 line(ctx,W,H,I){const p=Math.max(0,Math.min(1,I.draw));if(p<=0)return;const a=I.angle*Math.PI/180,cx=W*I.centerX,cy=H*I.centerY,dx=Math.cos(a),dy=Math.sin(a);const t0=(0-cx)/dx,t1=(W-cx)/dx;const x0=cx+dx*t0,y0=cy+dy*t0,x1=cx+dx*t1,y1=cy+dy*t1;const xe=x0+(x1-x0)*p,ye=y0+(y1-y0)*p;const col=css(I.lineColor);ctx.strokeStyle=col;ctx.lineWidth=I.thickness;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(xe,ye);ctx.stroke();if(p<1){ctx.shadowColor=col;ctx.shadowBlur=18;ctx.fillStyle=col;ctx.beginPath();ctx.arc(xe,ye,I.thickness*2.2,0,7);ctx.fill();ctx.shadowBlur=0}},
 sphere(ctx,W,H,I){const cx=W/2,cy=H/2,R=Math.min(W,H)/2*I.radius,step=I.step,as=Math.max(0,Math.min(1,I.assemble));if(as<=0)return;const a=I.lineAngle*Math.PI/180,nx=-Math.sin(a),ny=Math.cos(a);let lx=I.lightX,ly=I.lightY;const l2=lx*lx+ly*ly;let lz=l2<1?Math.sqrt(1-l2):0;const ln=Math.hypot(lx,ly,lz)||1;lx/=ln;ly/=ln;lz/=ln;const top=css(I.topColor),bot=css(I.bottomColor);for(let gy=-R;gy<=R+.001;gy+=step)for(let gx=-R;gx<=R+.001;gx+=step){const d2=gx*gx+gy*gy;if(d2>R*R)continue;const sd=gx*nx+gy*ny;if(Math.abs(sd)<I.gap/2)continue;const z=Math.sqrt(Math.max(0,1-d2/(R*R)));const lit=gx/R*lx+gy/R*ly+z*lz;const sh=I.shadeFloor+(1-I.shadeFloor)*Math.max(0,lit);const t=Math.abs(sd)/R;const loc=Math.max(0,Math.min(1,(as*1.3-t)/.3));if(loc<=0)continue;const e=1-Math.pow(1-loc,3);const r=step*.48*sh*e;if(r<.35)continue;ctx.fillStyle=sd<0?top:bot;ctx.beginPath();ctx.arc(cx+gx,cy+gy,r,0,7);ctx.fill()}},

 icon(ctx,w,h,I){const p=Math.max(0,Math.min(1,I.draw));if(p<=0)return;ctx.strokeStyle=css(I.iconColor);ctx.lineWidth=Math.max(1,w*.11);ctx.lineCap='round';ctx.lineJoin='round';if(I.kind==='check'){const P=[[.16,.54],[.4,.76],[.86,.26]];const s1=Math.hypot((P[1][0]-P[0][0])*w,(P[1][1]-P[0][1])*h),s2=Math.hypot((P[2][0]-P[1][0])*w,(P[2][1]-P[1][1])*h);const len=(s1+s2)*p;ctx.beginPath();ctx.moveTo(P[0][0]*w,P[0][1]*h);const f1=Math.min(1,len/s1);ctx.lineTo((P[0][0]+(P[1][0]-P[0][0])*f1)*w,(P[0][1]+(P[1][1]-P[0][1])*f1)*h);if(len>s1){const f2=Math.min(1,(len-s1)/s2);ctx.lineTo((P[1][0]+(P[2][0]-P[1][0])*f2)*w,(P[1][1]+(P[2][1]-P[1][1])*f2)*h)}ctx.stroke()}else{const a=Math.min(1,p*2),b=Math.max(0,p*2-1);ctx.beginPath();ctx.moveTo(.22*w,.22*h);ctx.lineTo((.22+.56*a)*w,(.22+.56*a)*h);if(b>0){ctx.moveTo(.78*w,.22*h);ctx.lineTo((.78-.56*b)*w,(.22+.56*b)*h)}ctx.stroke()}},
 dot(ctx,W,H,I){ctx.shadowColor=css(I.dotColor,.9);ctx.shadowBlur=I.glow;ctx.fillStyle=css(I.dotColor);ctx.beginPath();ctx.arc(W/2,H/2,I.dotRadius,0,7);ctx.fill();ctx.shadowBlur=0}
};

function wrap(ctx,text,w){const out=[];for(const para of text.split('\n')){let line='';for(const word of para.split(' ')){const t=line?line+' '+word:word;if(ctx.measureText(t).width>w&&line){out.push(line);line=word}else line=t}out.push(line)}return out}

 for(const L of S.layers){const F=L.F||{};const op=F.opacity?sample(F.opacity,t):1;const pos=F.position?sample(F.position,t):L.pos;if(op<=0)continue;ctx.save();ctx.globalAlpha=op;
