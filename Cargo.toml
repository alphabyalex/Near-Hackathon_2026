[workspace]
resolver = "2"
members = [
  "contracts/vault",
  "contracts/evidence",
  "contracts/mock-token",
  "tests/sandbox/proxy-contract"
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
near-sdk = { version = "=5.30.0", features = ["legacy"] }
near-contract-standards = "=5.30.0"
# near-sdk 5.30.0 published permissive internal ranges. Pin the matching
# release set so later internal releases cannot make this workspace fail.
near-sdk-macros = "=5.30.0"
near-sys = "=0.4.0"
near-sdk-env = "=0.1.8"
near-sdk-core = "=4.4.1"
near-global-contracts = "=0.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
overflow-checks = true
strip = true
