name: Repair and verify Spend Gym

on:
  push:
    branches:
      - tharun
    paths:
      - ".github/workflows/repair-and-verify.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spend-gym-repair-and-verify
  cancel-in-progress: true

jobs:
  repair-and-verify:
    name: Repair, run all gates, and publish verified source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out tharun
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply final source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vault = Path("contracts/vault/src/lib.rs")
          source = vault.read_text()

          old_guard = "&& payable.operation_id.is_some()"
          new_guard = "&& let Some(operation_id) = payable.operation_id"
          old_value = 'payable.operation_id.expect("checked operation id").0'
          new_value = "operation_id.0"
          if old_guard in source and old_value in source:
              source = source.replace(old_guard, new_guard, 1)
              source = source.replace(old_value, new_value, 1)
          elif new_guard not in source or new_value not in source:
              raise SystemExit("expected replay-path tokens were not found")

          old_trait = "#[ext_contract(ext_ft)]\ntrait ExtFungibleToken"
          new_trait = "#[ext_contract(ext_ft)]\n#[allow(dead_code)]\ntrait ExtFungibleToken"
          if old_trait in source:
              source = source.replace(old_trait, new_trait, 1)
          elif new_trait not in source:
              raise SystemExit("expected ext-contract trait was not found")
          vault.write_text(source)

          helper = Path("tests/sandbox/helpers.mjs")
          source = helper.read_text()
          old_start = "export async function setupSandbox(options = {}) {\n  const worker = await Worker.init();\n  const root = worker.rootAccount;"
          new_start = "export async function setupSandbox(options = {}) {\n  const worker = await Worker.init();\n  try {\n    const root = worker.rootAccount;"
          if old_start in source:
              source = source.replace(old_start, new_start, 1)
          elif new_start not in source:
              raise SystemExit("expected sandbox setup start was not found")

          old_end = "  return fixture;\n}\n"
          new_end = "    return fixture;\n  } catch (error) {\n    try {\n      await worker.tearDown();\n    } catch {\n      // Preserve the original setup failure.\n    }\n    throw error;\n  }\n}\n"
          if old_end in source:
              source = source.replace(old_end, new_end, 1)
          elif new_end not in source:
              raise SystemExit("expected sandbox setup end was not found")
          helper.write_text(source)

          Path("docs/status/clippy-latest.txt").unlink(missing_ok=True)
          Path("docs/status/clippy-patched.txt").unlink(missing_ok=True)
          PY

      - name: Install pnpm 10.20.0
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 10.20.0
          run_install: false

      - name: Install Node.js 22.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.22.2"
          cache: pnpm

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install frozen TypeScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check TypeScript packages and scripts
        run: pnpm typecheck

      - name: Run TypeScript unit tests
        run: pnpm test

      - name: Format and check Rust source
        run: |
          cargo fmt --all
          cargo fmt --all --check

      - name: Run Rust unit tests
        run: cargo test --workspace --all-targets --locked

      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build all Wasm contracts
        run: pnpm contracts:build

      - name: Run NEAR sandbox parity tests
        env:
          NEAR_WORKSPACES_DEBUG: "true"
        run: timeout --signal=TERM --kill-after=30s 20m pnpm --filter @spendgym/sandbox-tests exec node --test --test-concurrency=1 parity.test.mjs

      - name: Run NEAR sandbox security tests
        env:
          NEAR_WORKSPACES_DEBUG: "true"
        run: timeout --signal=TERM --kill-after=30s 40m pnpm --filter @spendgym/sandbox-tests exec node --test --test-concurrency=1 vault-security.test.mjs

      - name: Scan source safety boundaries
        run: pnpm scan:secrets

      - name: Check repository diff
        run: git diff --check

      - name: Record verified status
        env:
          VERIFY_RUN_ID: ${{ github.run_id }}
          VERIFY_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("docs/status/tharun.md")
          source = path.read_text()
          source = source.replace("Updated: 2026-11-05 UTC", "Updated: 2026-11-06 UTC", 1)

          start = source.index("## Verification\n")
          end = source.index("## Requests for the merge agent\n")
          run_id = os.environ["VERIFY_RUN_ID"]
          sha = os.environ["VERIFY_SHA"]
          verification = "\n".join([
              "## Verification",
              "",
              f"- PASS in GitHub Actions run `{run_id}` from source commit `{sha}`: frozen dependency installation.",
              "- PASS: TypeScript compilation for the simulator, vault client, and contract scripts.",
              "- PASS: all simulator, vault-client, and deployment-helper unit tests.",
              "- PASS: Rust formatting, workspace tests, and Clippy with warnings denied.",
              "- PASS: vault, evidence, mock-token, and sandbox-proxy Wasm builds.",
              "- PASS: NEAR sandbox parity and adversarial security tests in separate bounded steps.",
              "- PASS: authored-source secret, mainnet, generated-output, and em dash scans.",
              "- NOT RUN: testnet deployment, live key inspection, and malicious-signer execution because credentials are intentionally absent.",
              "",
              "",
          ])
          source = source[:start] + verification + source[end:]
          path.write_text(source)
          PY

      - name: Commit verified source
        run: |
          git add contracts/vault/src/lib.rs tests/sandbox/helpers.mjs docs/status/tharun.md
          git add -u docs/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: publish verified crypto source"
          git push origin HEAD:tharun

# final-source-run: 2026-11-06-1
