name: Diagnose Clippy

on:
  push:
    branches:
      - tharun
    paths:
      - ".github/workflows/diagnose-clippy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spend-gym-clippy-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tharun
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tharun
          fetch-depth: 0

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: clippy

      - name: Capture Clippy diagnostics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p docs/status
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee docs/status/clippy-diagnostics.txt
          status=${PIPESTATUS[0]}
          printf '\nclippy_exit_status=%s\n' "$status" >> docs/status/clippy-diagnostics.txt
          git add docs/status/clippy-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: capture Clippy diagnostics"
          git push origin HEAD:tharun
