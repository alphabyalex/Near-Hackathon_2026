name: Extract Clippy log

on:
  push:
    branches:
      - tharun
    paths:
      - ".github/workflows/extract-clippy-log.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tharun
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tharun
          fetch-depth: 0

      - name: Download and summarize failed Clippy job
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/status /tmp/clippy-log
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/127711950294/logs" \
            --output /tmp/clippy-log.zip
          unzip -q /tmp/clippy-log.zip -d /tmp/clippy-log
          {
            echo "# Clippy diagnostics extracted from job 127711950294"
            echo
            grep -R -n -E 'error:|warning:|--> contracts/|--> tests/' /tmp/clippy-log || true
          } > docs/status/clippy-extracted.txt
          test -s docs/status/clippy-extracted.txt
          git add docs/status/clippy-extracted.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: extract failed Clippy diagnostics"
          git push origin HEAD:tharun
