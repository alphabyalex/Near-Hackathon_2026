name: crypto-ci

on:
  push:
    branches:
      - tharun
    paths-ignore:
      - ".github/workflows/repair-and-verify.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify contracts, clients, simulator, and sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pnpm 10.20.0
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 10.20.0
          run_install: false

      - name: Install Node.js 22.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.22.2"
          cache: pnpm

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check TypeScript packages and scripts
        run: pnpm typecheck

      - name: Run TypeScript unit tests
        run: pnpm test

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Rust unit tests
        run: cargo test --workspace --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build contract Wasm files
        run: pnpm contracts:build

      - name: Run NEAR sandbox parity tests
        env:
          NEAR_WORKSPACES_DEBUG: "true"
        run: timeout --signal=TERM --kill-after=30s 20m pnpm --filter @spendgym/sandbox-tests exec node --test --test-concurrency=1 parity.test.mjs

      - name: Run NEAR sandbox security tests
        env:
          NEAR_WORKSPACES_DEBUG: "true"
        run: timeout --signal=TERM --kill-after=30s 40m pnpm --filter @spendgym/sandbox-tests exec node --test --test-concurrency=1 vault-security.test.mjs

      - name: Scan authored source
        run: pnpm scan:secrets
