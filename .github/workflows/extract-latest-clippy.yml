name: Extract latest Clippy diagnostic

on:
  push:
    branches:
      - tharun
    paths:
      - ".github/workflows/extract-latest-clippy.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tharun
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tharun
          fetch-depth: 0

      - name: Extract compiler diagnostic from failed job
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/status
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/127715313162/logs" \
            --output /tmp/job.log
          sed -E $'s/\\x1B\\[[0-9;]*[mK]//g' /tmp/job.log > /tmp/job-clean.log
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/job-clean.log').read_text(errors='replace').splitlines()
          selected = []
          for index, line in enumerate(lines):
              if 'error:' in line or 'warning:' in line or 'could not compile' in line:
                  start = max(0, index - 8)
                  end = min(len(lines), index + 20)
                  selected.extend(lines[start:end])
          deduped = []
          seen = set()
          for line in selected:
              if line not in seen:
                  seen.add(line)
                  deduped.append(line)
          output = '# Clippy diagnostic from job 127715313162\n\n' + '\n'.join(deduped) + '\n'
          Path('docs/status/clippy-latest.txt').write_text(output)
          if len(deduped) == 0:
              raise SystemExit('no compiler diagnostic found')
          PY
          git add docs/status/clippy-latest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: capture exact latest Clippy diagnostic"
          git push origin HEAD:tharun
