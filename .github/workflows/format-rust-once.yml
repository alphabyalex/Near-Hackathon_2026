name: Format Rust once

on:
  push:
    branches:
      - tharun
    paths:
      - ".github/workflows/format-rust-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spend-gym-rust-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out tharun
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tharun
          fetch-depth: 0

      - name: Install Rust 1.95.0 formatter
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          git diff --check

      - name: Commit formatted Rust source
        shell: bash
        run: |
          set -euo pipefail
          git add contracts tests/sandbox/proxy-contract
          if git diff --cached --quiet; then
            echo "Rust source was already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(rust): apply pinned rustfmt"
          git push origin HEAD:tharun
