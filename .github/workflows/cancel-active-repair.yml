name: Cancel superseded repair run

on:
  push:
    branches:
      - tharun
    paths:
      - ".github/workflows/cancel-active-repair.yml"

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel superseded run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/42179709020/cancel" || true
