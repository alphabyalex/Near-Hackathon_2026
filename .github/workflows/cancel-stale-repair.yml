name: Cancel stale repair and restart

on:
  push:
    branches:
      - tharun
    paths:
      - ".github/workflows/cancel-stale-repair.yml"

permissions:
  actions: write
  contents: write

jobs:
  restart:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tharun
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Cancel the stale repair run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/42177076508/cancel" || true

      - name: Trigger repair from the latest branch head
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/repair-and-verify.yml')
          source = path.read_text()
          source = source.rstrip() + '\n\n# restart-token: 2026-11-06-1\n'
          path.write_text(source)
          PY
          rm -f .github/workflows/cancel-stale-repair.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: restart bounded verification from latest head"
          git push origin HEAD:tharun
