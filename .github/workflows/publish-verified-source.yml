name: Publish verified Spend Gym source

on:
  push:
    branches:
      - tharun
    paths:
      - ".github/workflows/publish-verified-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spend-gym-source-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Reconstruct, verify, and publish source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out tharun
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tharun
          fetch-depth: 0

      - name: Reconstruct and safely extract source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "tharun"
          parts=(.handoff/source.part-*)
          test "${#parts[@]}" -eq 6
          cat "${parts[@]}" | base64 --decode > /tmp/spend-gym-source.tar.gz
          echo "4b8a06836aeb96f9a00d3e8264737ca3b93168134312ab3bb73e619b99b2e52e  /tmp/spend-gym-source.tar.gz" | sha256sum --check --strict

          rm -rf /tmp/spend-gym-source
          mkdir -p /tmp/spend-gym-source
          python3 - <<'PY'
          from pathlib import Path
          import tarfile

          archive_path = Path('/tmp/spend-gym-source.tar.gz')
          destination = Path('/tmp/spend-gym-source').resolve()
          with tarfile.open(archive_path, 'r:gz') as archive:
              for member in archive.getmembers():
                  name = member.name
                  if name.startswith('/'):
                      raise SystemExit(f'absolute archive path: {name}')
                  target = (destination / name).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit(f'archive path escape: {name}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsupported archive member: {name}')
              archive.extractall(destination)
          PY

          test -f /tmp/spend-gym-source/spend-gym/Cargo.toml
          test -f /tmp/spend-gym-source/spend-gym/package.json
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/spend-gym-source/spend-gym/. .

      - name: Install pnpm 10.20.0
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 10.20.0
          run_install: false

      - name: Install Node.js 22.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.22.2"

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Generate deterministic lockfiles
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          cargo generate-lockfile
          test -f pnpm-lock.yaml
          test -f Cargo.lock

      - name: Verify TypeScript packages and scripts
        run: |
          pnpm typecheck
          pnpm test

      - name: Verify Rust contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build Wasm contracts
        run: pnpm contracts:build

      - name: Run sandbox security and parity tests
        run: pnpm test:sandbox

      - name: Run source safety checks
        shell: bash
        run: |
          set -euo pipefail
          pnpm scan:secrets
          git diff --check
          if grep -RIl $'\xE2\x80\x94' --exclude-dir=.git --exclude-dir=node_modules --exclude='pnpm-lock.yaml' .; then
            echo "em dash found in authored source" >&2
            exit 1
          fi

      - name: Commit verified source and lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: publish verified Spend Gym crypto lane"
          git push origin HEAD:tharun
